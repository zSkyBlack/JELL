<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contacto | Joan Escrivá</title>

    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body>

    <a href="index.html" class="back-btn">← Volver al Muro</a>

    <main class="contact-page">

        <h1 class="contact-heading" id="contact-heading">Tienes una carta...</h1>

        <section class="owl-contact-scene" id="owl-scene">

            <button class="owl-button" id="owl-button" aria-label="Abrir el sobre">
                <span class="magic-glow"></span>

                <img src="img/buho-carta.png" alt="Búho cartoon con un sobre" class="owl-image">

                <span class="opening-envelope" aria-hidden="true">
                    <span class="open-env-back"></span>
                    <span class="open-env-letter"></span>
                    <span class="open-env-left"></span>
                    <span class="open-env-right"></span>
                    <span class="open-env-bottom"></span>
                    <span class="open-env-flap"></span>
                    <span class="open-env-seal"></span>
                </span>
            </button>

            <div class="hint-layer" id="hint-layer"></div>

            <article class="contact-card" id="contact-card">
                <h2>CONTACTO</h2>

                <div class="contact-info">
                    <p>
                        <span>Correo:</span>
                        <a href="mailto:jescrivalloret@gmail.com">
                            jescrivalloret@gmail.com
                        </a>
                    </p>

                    <p>
                        <span>LinkedIn:</span>
                        <a href="https://www.linkedin.com/in/joan-escriva-lloret/" target="_blank" rel="noopener noreferrer">
                            linkedin.com/in/joan-escriva-lloret
                        </a>
                    </p>
                </div>
            </article>

        </section>

    </main>

    <script src="js/contacto.js"></script>
</body>
</html>
